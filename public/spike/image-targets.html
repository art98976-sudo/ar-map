<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Image Target Spike</title>
    <!-- Phase 2 spike: do 8th Wall image targets run alongside SLAM (absolute scale) in our engine build?
         Not part of the app: nothing links here. See public/spike/README.md. -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px/1.35 ui-monospace, Menlo, monospace; }
      canvas#xr { position: fixed; inset: 0; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 8px; right: 8px; top: max(8px, env(safe-area-inset-top)); max-height: 62vh; overflow: auto;
             background: rgba(0, 0, 0, 0.62); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; }
      #bar { position: fixed; left: 8px; right: 8px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap; }
      button { flex: 1 1 30%; min-height: 44px; border: 0; border-radius: 10px; background: #006938; color: #fff; font: 600 14px system-ui, sans-serif; }
      button.ghost { background: rgba(255, 255, 255, 0.18); }
      .ok { color: #7ee787; } .warn { color: #f7d64c; } .bad { color: #ff7b72; }
      #start { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1410; padding: 24px; text-align: center; font: 15px/1.45 system-ui, sans-serif; }
      #start button { max-width: 320px; width: 100%; margin-top: 16px; }
    </style>
    <script src="/external/xr/xr.js" async data-preload-chunks="slam"></script>
    <script src="./image-targets.js" type="module"></script>
  </head>
  <body>
    <canvas id="xr"></canvas>
    <pre id="hud">Loading the 8th Wall engine…</pre>
    <div id="bar">
      <button id="reset" class="ghost" type="button">Reset stats</button>
      <button id="mark" class="ghost" type="button">Mark: at sign</button>
      <button id="download" type="button">Download log</button>
    </div>
    <div id="start">
      <div>
        <strong>Image target + SLAM spike</strong>
        <p>Print <a href="./print.html" style="color:#7ee787">the two test signs</a>, tape them to a wall at eye height, then tap Start.</p>
        <button id="go" type="button">Start camera</button>
      </div>
    </div>
  </body>
</html>
